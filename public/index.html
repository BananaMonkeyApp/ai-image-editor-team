<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Image Editor</title>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0a0a0a; color: #eee; min-height: 100vh; }
  .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
  h1 { text-align: center; margin-bottom: 20px; background: linear-gradient(90deg, #06f, #f0f); -webkit-background-clip: text; background-clip: text; color: transparent; font-size: 1.8rem; }
  h2 { font-size: 1.3rem; margin-bottom: 12px; }
  h3 { font-size: 1.05rem; margin-bottom: 10px; color: #ccc; }

  .view { display: none; }
  .view.active { display: block; }

  .card { background: #1a1a1a; border-radius: 12px; padding: 20px; margin-bottom: 15px; border: 1px solid #2a2a2a; }
  .card-title { font-weight: 600; margin-bottom: 12px; color: #ddd; font-size: 0.95rem; }

  input, textarea, select { width: 100%; padding: 12px; background: #0f0f0f; border: 1px solid #333; color: #fff; border-radius: 8px; font-size: 1rem; font-family: inherit; }
  textarea { resize: vertical; min-height: 60px; }

  .btn { padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 1rem; }
  .btn-primary { background: linear-gradient(90deg, #06f, #a0f); color: white; }
  .btn-secondary { background: #333; color: white; }
  .btn-danger { background: #a03; color: white; }
  .btn-success { background: #0a5; color: white; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-small { padding: 6px 12px; font-size: 0.85rem; }
  .btn-full { width: 100%; }

  .auth-container { max-width: 380px; margin: 50px auto; }
  .auth-container input { margin-bottom: 12px; }
  .auth-tabs { display: flex; margin-bottom: 20px; }
  .auth-tabs button { flex: 1; padding: 10px; background: #222; border: 1px solid #333; color: #888; cursor: pointer; }
  .auth-tabs button.active { background: #06f; color: white; }
  .auth-tabs button:first-child { border-radius: 8px 0 0 8px; }
  .auth-tabs button:last-child { border-radius: 0 8px 8px 0; }

  .topbar { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; margin-bottom: 15px; border-bottom: 1px solid #2a2a2a; }
  .topbar .user-info { display: flex; align-items: center; gap: 12px; }
  .balance-badge { background: linear-gradient(90deg, #f80, #fa0); color: black; padding: 6px 14px; border-radius: 20px; font-weight: 700; font-size: 0.95rem; }

  .upload-area { border: 2px dashed #444; border-radius: 10px; padding: 30px 20px; text-align: center; cursor: pointer; }
  .upload-area:hover { border-color: #06f; }
  .upload-area input { display: none; }
  .preview { max-width: 100%; max-height: 300px; border-radius: 8px; margin: 12px auto; display: block; }

  .preset-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px; }
  .preset-btn { padding: 12px; background: #222; border: 1px solid #333; color: #fff; border-radius: 8px; cursor: pointer; font-size: 0.85rem; position: relative; }
  .preset-btn:hover { background: #06f; border-color: #06f; }
  .preset-btn.selected { background: #06f; border-color: #f0f; }
  .preset-cost { display: block; font-size: 0.7rem; color: #fa0; margin-top: 4px; font-weight: 700; }

  .status { text-align: center; padding: 15px; margin: 15px 0; background: #1a1a1a; border-radius: 8px; color: #06f; }
  .error { background: #2a1010; color: #f66; padding: 12px; border-radius: 8px; margin: 12px 0; font-size: 0.9rem; }
  .success { background: #103010; color: #6f6; padding: 12px; border-radius: 8px; margin: 12px 0; font-size: 0.9rem; }
  .spinner { display: inline-block; width: 18px; height: 18px; border: 3px solid #333; border-top-color: #06f; border-radius: 50%; animation: spin 1s linear infinite; vertical-align: middle; margin-right: 10px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .packs-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
  .pack-btn { background: #222; border: 2px solid #333; padding: 15px; border-radius: 10px; cursor: pointer; text-align: center; }
  .pack-btn:hover { border-color: #06f; }
  .pack-price { font-size: 1.4rem; font-weight: 800; color: #fa0; }
  .pack-coins { font-size: 0.9rem; color: #aaa; margin-top: 4px; }

  .tabs { display: flex; gap: 4px; margin-bottom: 15px; overflow-x: auto; }
  .tabs button { background: #222; border: 1px solid #333; color: #aaa; padding: 8px 16px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
  .tabs button.active { background: #06f; color: white; border-color: #06f; }

  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { text-align: left; padding: 10px; border-bottom: 1px solid #2a2a2a; }
  th { color: #888; font-weight: 600; }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; justify-content: center; align-items: center; padding: 20px; }
  .modal.active { display: flex; }
  .modal-content { background: #1a1a1a; padding: 24px; border-radius: 12px; max-width: 500px; width: 100%; max-height: 90vh; overflow-y: auto; }
  .modal-content h3 { margin-bottom: 15px; }
  .modal img { max-width: 100%; max-height: 70vh; }

  .result-img { max-width: 100%; max-height: 500px; border-radius: 8px; margin: 12px auto; display: block; }
  .logout-btn { background: #333; color: white; padding: 6px 14px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }

  .session-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .session-card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 10px; padding: 10px; }
  .session-images { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
  .session-images img { width: 100%; height: 130px; object-fit: cover; border-radius: 6px; cursor: pointer; }
  .session-label { font-size: 0.7rem; color: #888; }
  .session-prompt { font-size: 0.8rem; color: #ddd; background: #0f0f0f; padding: 6px; border-radius: 6px; margin: 4px 0; max-height: 60px; overflow-y: auto; }
  .session-meta { font-size: 0.7rem; color: #888; }

  label { display: block; margin-bottom: 4px; font-size: 0.85rem; color: #aaa; }
  .form-row { margin-bottom: 10px; }
</style>
</head>
<body>

<div class="container">
  <h1>🎨 AI Image Editor</h1>

  <!-- LOGIN / SIGNUP -->
  <div id="authView" class="view active auth-container">
    <div class="auth-tabs">
      <button id="tabLogin" class="active" onclick="switchAuthTab('login')">Login</button>
      <button id="tabSignup" onclick="switchAuthTab('signup')">Sign Up</button>
    </div>
    <div class="card">
      <input type="email" id="authEmail" placeholder="Email" autocomplete="username">
      <input type="password" id="authPassword" placeholder="Password" autocomplete="current-password">
      <button class="btn btn-primary btn-full" id="authBtn" onclick="doAuth()">Login</button>
      <div id="authError" class="error" style="display:none;"></div>
    </div>
  </div>

  <!-- USER DASHBOARD -->
  <div id="userView" class="view">
    <div class="topbar">
      <div class="user-info">
        <span id="userEmail" style="font-size: 0.9rem; color: #aaa;"></span>
      </div>
      <div style="display: flex; align-items: center; gap: 10px;">
        <span class="balance-badge">🪙 <span id="userBalance">0</span></span>
        <button class="btn btn-small btn-secondary" onclick="showBuyCoins()">+ Add Coins</button>
        <button class="logout-btn" onclick="logout()">Logout</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">1. Upload Image</div>
      <div class="upload-area" onclick="document.getElementById('fileInput').click()">
        <input type="file" id="fileInput" accept="image/*" onchange="handleFileSelect(event)">
        <p>📤 Click to select image</p>
      </div>
      <img id="preview" class="preview" style="display:none">
    </div>

    <div class="card">
      <div class="card-title">2. Choose Edit</div>
      <div id="presetGrid" class="preset-grid"></div>
      <div id="customPromptBox" style="margin-top: 12px; display: none;">
        <label>Or write custom prompt (<span id="customCost">120</span> coins)</label>
        <textarea id="customPrompt" placeholder="Describe your edit..."></textarea>
      </div>
    </div>

    <div class="card">
      <div class="card-title">3. LoRA (optional style)</div>
      <select id="loraSelect">
        <option value="Photo-to-Anime">Photo-to-Anime (default)</option>
        <option value="Anime-V2">Anime-V2</option>
        <option value="Multiple-Angles">Multiple-Angles</option>
        <option value="Light-Migration">Light-Migration</option>
        <option value="Upscaler">Upscaler</option>
        <option value="Style-Transfer">Style-Transfer</option>
        <option value="Manga-Tone">Manga-Tone</option>
        <option value="Anything2Real">Anything2Real</option>
        <option value="Polaroid-Photo">Polaroid-Photo</option>
        <option value="Unblur-Anything">Unblur-Anything</option>
        <option value="Hyper-Realistic-Portrait">Hyper-Realistic-Portrait</option>
        <option value="Ultra-Realistic-Portrait">Ultra-Realistic-Portrait</option>
        <option value="Pixar-Inspired-3D">Pixar-Inspired-3D</option>
        <option value="Noir-Comic-Book">Noir-Comic-Book</option>
        <option value="Any-light">Any-light</option>
        <option value="Studio-DeLight">Studio-DeLight</option>
        <option value="Cinematic-FlatLog">Cinematic-FlatLog</option>
        <option value="Midnight-Noir-Eyes-Spotlight">Midnight-Noir-Eyes-Spotlight</option>
        <option value="Fal-Multiple-Angles">Fal-Multiple-Angles</option>
      </select>
    </div>

    <div class="card">
      <button class="btn btn-primary btn-full" id="editBtn" onclick="submitEdit()">✨ Generate</button>
    </div>

    <div class="status" id="editStatus" style="display:none;">
      <span class="spinner"></span>
      <span>Processing... 20-90 seconds</span>
    </div>

    <div class="error" id="editError" style="display:none;"></div>
    <div class="success" id="editSuccess" style="display:none;"></div>

    <div class="card" id="resultCard" style="display:none;">
      <div class="card-title">Result</div>
      <img id="resultImg" class="result-img">
      <button class="btn btn-success btn-full" onclick="downloadResult()">⬇️ Download</button>
    </div>
  </div>

  <!-- ADMIN DASHBOARD -->
  <div id="adminView" class="view">
    <div class="topbar">
      <div><strong>👨‍💼 Admin Panel</strong> — <span id="adminEmail" style="color: #888;"></span></div>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
    <div class="tabs">
      <button class="active" data-tab="users" onclick="switchAdminTab('users')">Users</button>
      <button data-tab="presets" onclick="switchAdminTab('presets')">Presets</button>
      <button data-tab="packs" onclick="switchAdminTab('packs')">Coin Packs</button>
      <button data-tab="edits" onclick="switchAdminTab('edits')">Edits</button>
      <button data-tab="transactions" onclick="switchAdminTab('transactions')">Transactions</button>
    </div>
    <div id="adminContent" class="card">Loading...</div>
  </div>

  <!-- BUY COINS MODAL -->
  <div class="modal" id="buyModal" onclick="if(event.target===this) closeModal('buyModal')">
    <div class="modal-content">
      <h3>Buy Coins</h3>
      <div class="packs-grid" id="packsGrid"></div>
      <button class="btn btn-secondary btn-full" style="margin-top: 15px;" onclick="closeModal('buyModal')">Cancel</button>
    </div>
  </div>

  <!-- IMAGE MODAL -->
  <div class="modal" id="imgModal" onclick="closeModal('imgModal')">
    <div class="modal-content" style="max-width: 90%; padding: 0;">
      <img id="modalImage" style="width: 100%; border-radius: 12px;">
    </div>
  </div>

  <!-- GENERIC MODAL -->
  <div class="modal" id="genericModal" onclick="if(event.target===this) closeModal('genericModal')">
    <div class="modal-content" id="genericModalContent"></div>
  </div>
</div>

<script>
// =========================================================
// GLOBAL STATE
// =========================================================
let currentUser = null;
let currentToken = null;
let config = { presets: [], coin_packs: [], custom_prompt_cost: 120, custom_prompt_enabled: true, razorpay_key_id: '' };
let selectedPresetId = null;
let selectedIsCustom = false;
let selectedImageBase64 = null;
let resultImageData = null;
let authMode = 'login';

// =========================================================
// STARTUP
// =========================================================
window.addEventListener('DOMContentLoaded', () => {
  currentToken = localStorage.getItem('token');
  if (currentToken) {
    fetchMe();
  }
  loadConfig();
});

async function loadConfig() {
  try {
    const res = await fetch('/api/main?action=config');
    config = await res.json();
    renderPresets();
    renderPacks();
    if (config.custom_prompt_enabled) {
      document.getElementById('customPromptBox').style.display = 'block';
      document.getElementById('customCost').textContent = config.custom_prompt_cost;
    }
  } catch (e) {
    console.error('Config load failed', e);
  }
}

// =========================================================
// AUTH
// =========================================================
function switchAuthTab(mode) {
  authMode = mode;
  document.getElementById('tabLogin').classList.toggle('active', mode === 'login');
  document.getElementById('tabSignup').classList.toggle('active', mode === 'signup');
  document.getElementById('authBtn').textContent = mode === 'login' ? 'Login' : 'Sign Up';
}

async function doAuth() {
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  const errBox = document.getElementById('authError');
  errBox.style.display = 'none';

  if (!email || !password) {
    errBox.textContent = 'Enter email and password';
    errBox.style.display = 'block';
    return;
  }

  try {
    const res = await fetch(`/api/main?action=${authMode}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || 'Failed');

    currentToken = data.token;
    currentUser = data.user;
    localStorage.setItem('token', currentToken);
    showDashboard();
  } catch (err) {
    errBox.textContent = err.message;
    errBox.style.display = 'block';
  }
}

async function fetchMe() {
  try {
    const res = await fetch('/api/main?action=me', {
      headers: { Authorization: `Bearer ${currentToken}` }
    });
    if (!res.ok) throw new Error('Session expired');
    const data = await res.json();
    currentUser = data.user;
    showDashboard();
  } catch {
    logout();
  }
}

function logout() {
  localStorage.removeItem('token');
  currentToken = null;
  currentUser = null;
  hideAll();
  document.getElementById('authView').classList.add('active');
}

function showDashboard() {
  hideAll();
  if (currentUser.is_admin) {
    document.getElementById('adminView').classList.add('active');
    document.getElementById('adminEmail').textContent = currentUser.email;
    switchAdminTab('users');
  } else {
    document.getElementById('userView').classList.add('active');
    document.getElementById('userEmail').textContent = currentUser.email;
    document.getElementById('userBalance').textContent = currentUser.balance;
  }
}

function hideAll() {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
}

// =========================================================
// USER EDITOR
// =========================================================
function handleFileSelect(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    selectedImageBase64 = e.target.result;
    const preview = document.getElementById('preview');
    preview.src = selectedImageBase64;
    preview.style.display = 'block';
  };
  reader.readAsDataURL(file);
}

function renderPresets() {
  const grid = document.getElementById('presetGrid');
  if (!grid) return;
  grid.innerHTML = config.presets.map(p => `
    <button class="preset-btn" data-id="${p.id}" onclick="selectPreset(${p.id})">
      ${escapeHtml(p.name)}
      <span class="preset-cost">${p.cost} 🪙</span>
    </button>
  `).join('');
}

function selectPreset(id) {
  selectedPresetId = id;
  selectedIsCustom = false;
  document.querySelectorAll('.preset-btn').forEach(b => {
    b.classList.toggle('selected', parseInt(b.dataset.id) === id);
  });
  document.getElementById('customPrompt').value = '';
}

async function submitEdit() {
  const errBox = document.getElementById('editError');
  const successBox = document.getElementById('editSuccess');
  const status = document.getElementById('editStatus');
  const resultCard = document.getElementById('resultCard');
  const btn = document.getElementById('editBtn');

  errBox.style.display = 'none';
  successBox.style.display = 'none';
  resultCard.style.display = 'none';

  if (!selectedImageBase64) { showErr(errBox, 'Select an image first'); return; }

  let prompt, is_custom = false, preset_id = null;
  const customText = document.getElementById('customPrompt').value.trim();
  if (customText) {
    prompt = customText;
    is_custom = true;
  } else if (selectedPresetId) {
    const preset = config.presets.find(p => p.id === selectedPresetId);
    if (!preset) { showErr(errBox, 'Preset not found'); return; }
    prompt = preset.prompt;
    preset_id = preset.id;
  } else {
    showErr(errBox, 'Choose a preset or write a custom prompt');
    return;
  }

  const lora = document.getElementById('loraSelect').value;

  btn.disabled = true;
  status.style.display = 'block';

  try {
    const res = await fetch('/api/main?action=edit', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        Authorization: `Bearer ${currentToken}`
      },
      body: JSON.stringify({ image: selectedImageBase64, prompt, lora, preset_id, is_custom })
    });
    const data = await res.json();

    if (!res.ok || data.error) {
      if (data.refunded) {
        showErr(errBox, `${data.message || data.error}. Refunded ${data.refunded} coins.`);
        currentUser.balance = data.new_balance;
        document.getElementById('userBalance').textContent = currentUser.balance;
      } else {
        showErr(errBox, data.message || data.error || 'Failed');
      }
      return;
    }

    resultImageData = data.image;
    document.getElementById('resultImg').src = data.image;
    resultCard.style.display = 'block';
    currentUser.balance = data.new_balance;
    document.getElementById('userBalance').textContent = currentUser.balance;
    successBox.textContent = `✅ Edit complete! -${data.coins_spent} coins`;
    successBox.style.display = 'block';
  } catch (err) {
    showErr(errBox, err.message);
  } finally {
    btn.disabled = false;
    status.style.display = 'none';
  }
}

function downloadResult() {
  if (!resultImageData) return;
  const link = document.createElement('a');
  link.href = resultImageData;
  link.download = 'edited_' + Date.now() + '.png';
  link.click();
}

function showErr(box, msg) { box.textContent = msg; box.style.display = 'block'; }

// =========================================================
// BUY COINS (Razorpay)
// =========================================================
function showBuyCoins() {
  renderPacks();
  document.getElementById('buyModal').classList.add('active');
}

function renderPacks() {
  const grid = document.getElementById('packsGrid');
  if (!grid) return;
  grid.innerHTML = config.coin_packs.map(p => `
    <div class="pack-btn" onclick="buyPack(${p.id})">
      <div class="pack-price">₹${p.price_paise / 100}</div>
      <div class="pack-coins">${p.coins} coins</div>
    </div>
  `).join('');
}

async function buyPack(packId) {
  try {
    const res = await fetch('/api/main?action=create_order', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        Authorization: `Bearer ${currentToken}`
      },
      body: JSON.stringify({ pack_id: packId })
    });
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || 'Failed');

    closeModal('buyModal');

    const options = {
      key: data.razorpay_key_id,
      amount: data.amount,
      currency: data.currency,
      name: 'AI Image Editor',
      description: `${data.coins} coins`,
      order_id: data.order_id,
      handler: async function(response) {
        await verifyPayment(response);
      },
      prefill: { email: currentUser.email },
      theme: { color: '#0066ff' }
    };
    const rzp = new Razorpay(options);
    rzp.open();
  } catch (err) {
    alert('Error: ' + err.message);
  }
}

async function verifyPayment(response) {
  try {
    const res = await fetch('/api/main?action=verify_payment', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        Authorization: `Bearer ${currentToken}`
      },
      body: JSON.stringify(response)
    });
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || 'Verification failed');

    currentUser.balance = data.new_balance;
    document.getElementById('userBalance').textContent = currentUser.balance;
    alert(`✅ Success! Added ${data.coins_added} coins. Balance: ${data.new_balance}`);
  } catch (err) {
    alert('Payment verification error: ' + err.message);
  }
}

// =========================================================
// ADMIN
// =========================================================
function switchAdminTab(tab) {
  document.querySelectorAll('.tabs button').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === tab);
  });
  const content = document.getElementById('adminContent');
  content.innerHTML = 'Loading...';
  if (tab === 'users') loadAdminUsers();
  else if (tab === 'presets') loadAdminPresets();
  else if (tab === 'packs') loadAdminPacks();
  else if (tab === 'edits') loadAdminEdits();
  else if (tab === 'transactions') loadAdminTransactions();
}

async function loadAdminUsers() {
  const res = await apiAdmin('admin_users');
  const users = res.users || [];
  document.getElementById('adminContent').innerHTML = `
    <h3>All Users (${users.length})</h3>
    <table>
      <thead><tr><th>Email</th><th>Balance</th><th>Spent ₹</th><th>Signup</th><th>Actions</th></tr></thead>
      <tbody>
        ${users.map(u => `
          <tr>
            <td>${escapeHtml(u.email)} ${u.is_admin ? '👑' : ''}</td>
            <td>${u.balance} 🪙</td>
            <td>₹${u.total_spent}</td>
            <td>${new Date(u.created_at).toLocaleDateString()}</td>
            <td>
              <button class="btn btn-small btn-secondary" onclick="promptAddCoins(${u.id}, '${escapeHtml(u.email)}')">+ Coins</button>
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

async function promptAddCoins(userId, email) {
  const amt = prompt(`Add coins to ${email} (negative to subtract):`);
  if (amt === null) return;
  const n = parseInt(amt);
  if (isNaN(n)) return alert('Invalid number');
  const res = await apiAdmin('admin_add_coins', { user_id: userId, coins: n });
  if (res.error) return alert('Error: ' + res.error);
  alert(`✅ Done. New balance: ${res.new_balance}`);
  loadAdminUsers();
}

async function loadAdminPresets() {
  const res = await fetch('/api/main?action=config');
  const cfg = await res.json();
  const presets = cfg.presets || [];
  document.getElementById('adminContent').innerHTML = `
    <h3>Preset Buttons</h3>
    <table>
      <thead><tr><th>Name</th><th>Prompt</th><th>Cost</th><th>Order</th><th>Actions</th></tr></thead>
      <tbody>
        ${presets.map(p => `
          <tr>
            <td>${escapeHtml(p.name)}</td>
            <td style="max-width: 300px; font-size: 0.8rem;">${escapeHtml(p.prompt).slice(0, 100)}</td>
            <td>${p.cost} 🪙</td>
            <td>${p.sort_order}</td>
            <td>
              <button class="btn btn-small btn-secondary" onclick='editPreset(${JSON.stringify(p)})'>Edit</button>
              <button class="btn btn-small btn-danger" onclick="deletePreset(${p.id})">Delete</button>
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>
    <button class="btn btn-primary" style="margin-top: 15px;" onclick="editPreset(null)">+ Add Preset</button>
    <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid #333;">
      <h3>Custom Prompt Settings</h3>
      <div class="form-row">
        <label>Enabled</label>
        <input type="checkbox" id="customEnabled" ${cfg.custom_prompt_enabled ? 'checked' : ''}>
      </div>
      <div class="form-row">
        <label>Cost (coins)</label>
        <input type="number" id="customCostInput" value="${cfg.custom_prompt_cost}">
      </div>
      <button class="btn btn-success" onclick="saveCustomSettings()">Save Settings</button>
    </div>
  `;
}

function editPreset(preset) {
  const p = preset || { id: null, name: '', prompt: '', cost: 50, sort_order: 0, is_active: true };
  document.getElementById('genericModalContent').innerHTML = `
    <h3>${p.id ? 'Edit' : 'New'} Preset</h3>
    <div class="form-row"><label>Button Name (with emoji)</label><input id="pName" value="${escapeHtml(p.name)}"></div>
    <div class="form-row"><label>Prompt</label><textarea id="pPrompt" style="min-height: 80px;">${escapeHtml(p.prompt)}</textarea></div>
    <div class="form-row"><label>Cost (coins)</label><input type="number" id="pCost" value="${p.cost}"></div>
    <div class="form-row"><label>Sort Order</label><input type="number" id="pOrder" value="${p.sort_order || 0}"></div>
    <div style="display: flex; gap: 8px;">
      <button class="btn btn-primary" onclick="savePreset(${p.id || 'null'})">Save</button>
      <button class="btn btn-secondary" onclick="closeModal('genericModal')">Cancel</button>
    </div>
  `;
  document.getElementById('genericModal').classList.add('active');
}

async function savePreset(id) {
  const payload = {
    id: id,
    name: document.getElementById('pName').value.trim(),
    prompt: document.getElementById('pPrompt').value.trim(),
    cost: parseInt(document.getElementById('pCost').value),
    sort_order: parseInt(document.getElementById('pOrder').value) || 0
  };
  const res = await apiAdmin('admin_save_preset', payload);
  if (res.error) return alert('Error: ' + res.error);
  closeModal('genericModal');
  loadAdminPresets();
}

async function deletePreset(id) {
  if (!confirm('Delete this preset?')) return;
  const res = await apiAdmin('admin_delete_preset', { id });
  if (res.error) return alert('Error: ' + res.error);
  loadAdminPresets();
}

async function saveCustomSettings() {
  const payload = {
    custom_prompt_enabled: document.getElementById('customEnabled').checked,
    custom_prompt_cost: parseInt(document.getElementById('customCostInput').value)
  };
  const res = await apiAdmin('admin_save_settings', payload);
  if (res.error) return alert('Error: ' + res.error);
  alert('✅ Saved');
}

async function loadAdminPacks() {
  const res = await fetch('/api/main?action=config');
  const cfg = await res.json();
  const packs = cfg.coin_packs || [];
  document.getElementById('adminContent').innerHTML = `
    <h3>Coin Packs</h3>
    <table>
      <thead><tr><th>Price</th><th>Coins</th><th>Order</th><th>Actions</th></tr></thead>
      <tbody>
        ${packs.map(p => `
          <tr>
            <td>₹${p.price_paise / 100}</td>
            <td>${p.coins} 🪙</td>
            <td>${p.sort_order}</td>
            <td>
              <button class="btn btn-small btn-secondary" onclick='editPack(${JSON.stringify(p)})'>Edit</button>
              <button class="btn btn-small btn-danger" onclick="deletePack(${p.id})">Delete</button>
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>
    <button class="btn btn-primary" style="margin-top: 15px;" onclick="editPack(null)">+ Add Pack</button>
  `;
}

function editPack(pack) {
  const p = pack || { id: null, price_paise: 5000, coins: 50, sort_order: 0 };
  document.getElementById('genericModalContent').innerHTML = `
    <h3>${p.id ? 'Edit' : 'New'} Coin Pack</h3>
    <div class="form-row"><label>Price (₹)</label><input type="number" id="packRupees" value="${p.price_paise / 100}"></div>
    <div class="form-row"><label>Coins</label><input type="number" id="packCoins" value="${p.coins}"></div>
    <div class="form-row"><label>Sort Order</label><input type="number" id="packOrder" value="${p.sort_order || 0}"></div>
    <div style="display: flex; gap: 8px;">
      <button class="btn btn-primary" onclick="savePack(${p.id || 'null'})">Save</button>
      <button class="btn btn-secondary" onclick="closeModal('genericModal')">Cancel</button>
    </div>
  `;
  document.getElementById('genericModal').classList.add('active');
}

async function savePack(id) {
  const payload = {
    id: id,
    price_paise: parseInt(document.getElementById('packRupees').value) * 100,
    coins: parseInt(document.getElementById('packCoins').value),
    sort_order: parseInt(document.getElementById('packOrder').value) || 0
  };
  const res = await apiAdmin('admin_save_pack', payload);
  if (res.error) return alert('Error: ' + res.error);
  closeModal('genericModal');
  loadAdminPacks();
}

async function deletePack(id) {
  if (!confirm('Delete this pack?')) return;
  const res = await apiAdmin('admin_delete_pack', { id });
  if (res.error) return alert('Error: ' + res.error);
  loadAdminPacks();
}

async function loadAdminEdits() {
  const res = await apiAdmin('admin_edits');
  const edits = res.edits || [];
  document.getElementById('adminContent').innerHTML = `
    <h3>All Edits (${edits.length})</h3>
    <div class="session-grid">
      ${edits.map(e => `
        <div class="session-card">
          <div class="session-images">
            <div>
              <div class="session-label">Input</div>
              ${e.input_url ? `<img src="${e.input_url}" onclick="showImage('${e.input_url}')">` : '<div style="color:#666;font-size:0.75rem;padding:10px;">No image</div>'}
            </div>
            <div>
              <div class="session-label">Output</div>
              ${e.output_url ? `<img src="${e.output_url}" onclick="showImage('${e.output_url}')">` : '<div style="color:#666;font-size:0.75rem;padding:10px;">No image</div>'}
            </div>
          </div>
          <div class="session-meta"><strong>${escapeHtml(e.email || 'unknown')}</strong></div>
          <div class="session-prompt">${escapeHtml(e.prompt || '')}</div>
          <div class="session-meta">
            ${e.coins_spent} 🪙 · ${e.status} · ${new Date(e.created_at).toLocaleString()}
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

async function loadAdminTransactions() {
  const res = await apiAdmin('admin_transactions');
  const txns = res.transactions || [];
  document.getElementById('adminContent').innerHTML = `
    <h3>Transactions (${txns.length})</h3>
    <table>
      <thead><tr><th>User</th><th>Amount</th><th>Coins</th><th>Status</th><th>Time</th></tr></thead>
      <tbody>
        ${txns.map(t => `
          <tr>
            <td>${escapeHtml(t.email || 'unknown')}</td>
            <td>₹${t.amount_paise / 100}</td>
            <td>${t.coins_added}</td>
            <td>${t.status}</td>
            <td>${new Date(t.created_at).toLocaleString()}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

async function apiAdmin(action, body) {
  const res = await fetch(`/api/main?action=${action}`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      Authorization: `Bearer ${currentToken}`
    },
    body: body ? JSON.stringify(body) : null
  });
  return await res.json();
}

// =========================================================
// UTILITIES
// =========================================================
function showImage(url) {
  document.getElementById('modalImage').src = url;
  document.getElementById('imgModal').classList.add('active');
}
function closeModal(id) {
  document.getElementById(id).classList.remove('active');
}
function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = String(s ?? '');
  return div.innerHTML;
}
</script>
</body>
</html>
