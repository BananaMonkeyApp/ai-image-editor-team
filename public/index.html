<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Image Editor - Team</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0a0a0a;
    color: #eee;
    min-height: 100vh;
  }
  .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
  h1 {
    text-align: center;
    margin-bottom: 25px;
    background: linear-gradient(90deg, #06f, #f0f);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-size: 1.8rem;
  }

  .lock-screen {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; min-height: 70vh;
  }
  .lock-screen input {
    font-size: 2rem; padding: 15px 25px;
    background: #1a1a1a; border: 2px solid #333; color: #fff;
    border-radius: 10px; text-align: center; width: 220px; letter-spacing: 10px;
  }
  .lock-screen button {
    margin-top: 20px; padding: 12px 40px;
    background: #06f; color: white; border: none; border-radius: 8px;
    cursor: pointer; font-weight: 600; font-size: 1rem;
  }
  .lock-error { color: #f66; margin-top: 15px; }

  .view { display: none; }
  .view.active { display: block; }
  .card {
    background: #1a1a1a; border-radius: 12px; padding: 20px;
    margin-bottom: 15px; border: 1px solid #2a2a2a;
  }
  .upload-area {
    border: 2px dashed #444; border-radius: 10px;
    padding: 30px 20px; text-align: center; cursor: pointer;
  }
  .upload-area:hover { border-color: #06f; }
  .upload-area input { display: none; }
  .preview {
    max-width: 100%; max-height: 350px; border-radius: 8px;
    margin: 12px auto; display: block;
  }
  label {
    display: block; margin-bottom: 6px; font-weight: 600; color: #ccc;
  }
  textarea, select {
    width: 100%; padding: 12px;
    background: #0f0f0f; border: 1px solid #333; color: #fff;
    border-radius: 8px; font-size: 1rem; font-family: inherit;
  }
  textarea { resize: vertical; min-height: 60px; }
  .preset-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 8px; margin-bottom: 12px;
  }
  .preset-btn {
    padding: 10px; background: #222; border: 1px solid #333;
    color: #fff; border-radius: 8px; cursor: pointer; font-size: 0.85rem;
  }
  .preset-btn:hover { background: #06f; }
  .submit-btn {
    width: 100%; padding: 14px; font-size: 1.05rem;
    background: linear-gradient(90deg, #06f, #a0f);
    color: white; border: none; border-radius: 8px;
    cursor: pointer; font-weight: 600;
  }
  .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .status {
    text-align: center; padding: 15px; margin: 15px 0;
    background: #1a1a1a; border-radius: 8px; color: #06f;
  }
  .error {
    background: #2a1010; color: #f66; padding: 15px;
    border-radius: 8px; margin: 15px 0;
    font-family: monospace; font-size: 0.85rem;
    white-space: pre-wrap; word-break: break-all;
  }
  .spinner {
    display: inline-block; width: 18px; height: 18px;
    border: 3px solid #333; border-top-color: #06f;
    border-radius: 50%; animation: spin 1s linear infinite;
    vertical-align: middle; margin-right: 10px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .result-img {
    max-width: 100%; max-height: 500px; border-radius: 8px;
    margin: 12px auto; display: block;
  }
  .download-btn {
    padding: 10px 25px; background: #0a5; color: white;
    border: none; border-radius: 6px; cursor: pointer;
    margin-top: 10px; font-size: 0.95rem;
  }
  .logout {
    position: fixed; top: 15px; right: 15px;
    padding: 6px 14px; background: #333; color: white;
    border: none; border-radius: 6px; cursor: pointer;
    font-size: 0.85rem; z-index: 100;
  }

  .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .admin-header h2 { font-size: 1.4rem; }
  .refresh-btn {
    padding: 8px 16px; background: #06f; color: white;
    border: none; border-radius: 6px; cursor: pointer;
  }
  .session-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 15px;
  }
  .session-card {
    background: #1a1a1a; border: 1px solid #2a2a2a;
    border-radius: 10px; padding: 12px;
  }
  .session-images {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px;
  }
  .session-images img {
    width: 100%; height: 150px; object-fit: cover; border-radius: 6px;
    cursor: pointer; transition: transform 0.2s;
  }
  .session-images img:hover { transform: scale(1.03); }
  .session-label { font-size: 0.7rem; color: #888; margin-bottom: 2px; }
  .session-prompt {
    font-size: 0.85rem; color: #ddd; background: #0f0f0f;
    padding: 8px; border-radius: 6px; margin-bottom: 6px;
    max-height: 80px; overflow-y: auto;
  }
  .session-time { font-size: 0.7rem; color: #666; }
  .session-meta { font-size: 0.7rem; color: #888; margin-top: 4px; }

  .modal {
    display: none;
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.9); z-index: 200;
    justify-content: center; align-items: center;
  }
  .modal.active { display: flex; }
  .modal img { max-width: 90%; max-height: 90%; border-radius: 10px; }
  .modal-close {
    position: absolute; top: 20px; right: 20px;
    padding: 8px 16px; background: #333; color: white;
    border: none; border-radius: 6px; cursor: pointer;
  }

  .empty { text-align: center; color: #666; padding: 40px; }
</style>
</head>
<body>

<div class="container">
  <h1>🎨 AI Image Editor - Team</h1>

  <div class="lock-screen view active" id="lockView">
    <p style="margin-bottom: 20px; color: #999;">Enter access code</p>
    <input type="password" id="codeInput" maxlength="4" inputmode="numeric" pattern="[0-9]*" autofocus>
    <button onclick="checkCode()">Unlock</button>
    <p class="lock-error" id="lockError"></p>
  </div>

  <div class="view" id="editorView">
    <button class="logout" onclick="logout()">Logout</button>

    <div class="card">
      <label>1. Upload Image</label>
      <div class="upload-area" onclick="document.getElementById('fileInput').click()">
        <input type="file" id="fileInput" accept="image/*" onchange="handleFileSelect(event)">
        <p>📤 Click to select image</p>
      </div>
      <img id="preview" class="preview" style="display:none" alt="Preview">
    </div>

    <div class="card">
      <label>2. Prompt (preset or type)</label>
      <div class="preset-row">
        <button class="preset-btn" onclick="setPrompt('Convert this photo to anime style, preserve pose and features')">🎨 Anime</button>
        <button class="preset-btn" onclick="setPrompt('Enhance sharpness and remove blur')">🔍 Sharpen</button>
        <button class="preset-btn" onclick="setPrompt('Apply professional studio lighting')">💡 Studio Light</button>
      </div>
      <textarea id="promptInput" placeholder="Or type your own prompt..."></textarea>
    </div>

    <div class="card">
      <label>3. LoRA (optional style)</label>
      <select id="loraSelect">
        <option value="Photo-to-Anime">Photo-to-Anime (default)</option>
        <option value="Anime-V2">Anime-V2</option>
        <option value="Multiple-Angles">Multiple-Angles</option>
        <option value="Light-Migration">Light-Migration</option>
        <option value="Upscaler">Upscaler</option>
        <option value="Style-Transfer">Style-Transfer</option>
        <option value="Manga-Tone">Manga-Tone</option>
        <option value="Anything2Real">Anything2Real</option>
        <option value="Polaroid-Photo">Polaroid-Photo</option>
        <option value="Unblur-Anything">Unblur-Anything</option>
        <option value="Hyper-Realistic-Portrait">Hyper-Realistic-Portrait</option>
        <option value="Ultra-Realistic-Portrait">Ultra-Realistic-Portrait</option>
        <option value="Pixar-Inspired-3D">Pixar-Inspired-3D</option>
        <option value="Noir-Comic-Book">Noir-Comic-Book</option>
        <option value="Any-light">Any-light</option>
        <option value="Studio-DeLight">Studio-DeLight</option>
        <option value="Cinematic-FlatLog">Cinematic-FlatLog</option>
        <option value="Midnight-Noir-Eyes-Spotlight">Midnight-Noir-Eyes-Spotlight</option>
        <option value="Fal-Multiple-Angles">Fal-Multiple-Angles</option>
      </select>
    </div>

    <div class="card">
      <button class="submit-btn" id="submitBtn" onclick="submitEdit()">✨ Generate Edit</button>
    </div>

    <div class="status" id="status" style="display:none;">
      <span class="spinner"></span>
      <span>Processing... this can take 20-90 seconds</span>
    </div>

    <div class="error" id="errorBox" style="display:none;"></div>

    <div class="card" id="resultCard" style="display:none;">
      <label>Result</label>
      <img id="resultImg" class="result-img" alt="Result">
      <button class="download-btn" onclick="downloadResult()">⬇️ Download</button>
    </div>
  </div>

  <div class="view" id="adminView">
    <button class="logout" onclick="logout()">Logout</button>
    <div class="admin-header">
      <h2>📊 Team Activity</h2>
      <button class="refresh-btn" onclick="loadAdminData()">🔄 Refresh</button>
    </div>
    <div id="adminContent">
      <div class="empty">Loading...</div>
    </div>
  </div>

  <div class="modal" id="imageModal" onclick="closeModal()">
    <button class="modal-close" onclick="closeModal()">Close</button>
    <img id="modalImg" alt="Full">
  </div>
</div>

<script>
// ========================================================
// 🔐 CHANGE PASSWORDS HERE (must also match in api/edit.js and api/admin.js)
// ========================================================
const TEAM_CODE = "8800";
const ADMIN_CODE = "8700";
// ========================================================

let selectedImageBase64 = null;
let resultImageData = null;
let userRole = null;

function checkCode() {
  const code = document.getElementById("codeInput").value;
  if (code === TEAM_CODE) {
    userRole = "team";
    showEditor();
  } else if (code === ADMIN_CODE) {
    userRole = "admin";
    showAdmin();
  } else {
    document.getElementById("lockError").textContent = "Wrong code";
    document.getElementById("codeInput").value = "";
  }
}

function logout() {
  userRole = null;
  document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
  document.getElementById("lockView").classList.add("active");
  document.getElementById("codeInput").value = "";
  document.getElementById("codeInput").focus();
}

document.getElementById("codeInput").addEventListener("keypress", (e) => {
  if (e.key === "Enter") checkCode();
});

function showEditor() {
  document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
  document.getElementById("editorView").classList.add("active");
}

function showAdmin() {
  document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
  document.getElementById("adminView").classList.add("active");
  loadAdminData();
}

function handleFileSelect(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    selectedImageBase64 = e.target.result;
    const preview = document.getElementById("preview");
    preview.src = selectedImageBase64;
    preview.style.display = "block";
  };
  reader.readAsDataURL(file);
}

function setPrompt(text) {
  document.getElementById("promptInput").value = text;
}

async function submitEdit() {
  if (!selectedImageBase64) return alert("Select an image first");
  const prompt = document.getElementById("promptInput").value.trim();
  if (!prompt) return alert("Enter a prompt");
  const lora = document.getElementById("loraSelect").value;

  const btn = document.getElementById("submitBtn");
  const status = document.getElementById("status");
  const errorBox = document.getElementById("errorBox");
  const resultCard = document.getElementById("resultCard");

  btn.disabled = true;
  status.style.display = "block";
  errorBox.style.display = "none";
  resultCard.style.display = "none";

  try {
    const response = await fetch("/api/edit", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-App-Code": TEAM_CODE
      },
      body: JSON.stringify({
        image: selectedImageBase64,
        prompt: prompt,
        lora: lora
      })
    });
    const data = await response.json();
    if (!response.ok || data.error) {
      throw new Error(JSON.stringify(data, null, 2));
    }
    resultImageData = data.image;
    document.getElementById("resultImg").src = data.image;
    resultCard.style.display = "block";
    status.style.display = "none";
  } catch (err) {
    status.style.display = "none";
    errorBox.style.display = "block";
    errorBox.textContent = "ERROR:\n" + err.message;
  } finally {
    btn.disabled = false;
  }
}

function downloadResult() {
  if (!resultImageData) return;
  const link = document.createElement("a");
  link.href = resultImageData;
  link.download = "edited_" + Date.now() + ".png";
  link.click();
}

async function loadAdminData() {
  const content = document.getElementById("adminContent");
  content.innerHTML = '<div class="empty">Loading...</div>';

  try {
    const response = await fetch("/api/admin", {
      method: "POST",
      headers: { "X-App-Code": ADMIN_CODE }
    });
    const data = await response.json();
    if (data.error) throw new Error(data.error);

    const sessions = data.sessions || [];
    if (sessions.length === 0) {
      content.innerHTML = '<div class="empty">No edits logged yet. Team edits will appear here.</div>';
      return;
    }

    content.innerHTML = `<div class="session-grid">${sessions.map(s => `
      <div class="session-card">
        <div class="session-images">
          <div>
            <div class="session-label">Input</div>
            ${s.inputUrl ? `<img src="${s.inputUrl}" onclick="showModal('${s.inputUrl}')">` : '<div class="empty">No input</div>'}
          </div>
          <div>
            <div class="session-label">Output</div>
            ${s.outputUrl ? `<img src="${s.outputUrl}" onclick="showModal('${s.outputUrl}')">` : '<div class="empty">No output</div>'}
          </div>
        </div>
        <div class="session-label">Prompt</div>
        <div class="session-prompt">${escapeHtml(s.prompt || '(no prompt)')}</div>
        <div class="session-time">🕐 ${formatTime(s.timestamp)}</div>
        ${s.lora ? `<div class="session-meta">LoRA: ${escapeHtml(s.lora)}</div>` : ''}
      </div>
    `).join('')}</div>`;
  } catch (err) {
    content.innerHTML = `<div class="error">Failed to load: ${err.message}</div>`;
  }
}

function escapeHtml(s) {
  const div = document.createElement("div");
  div.textContent = s;
  return div.innerHTML;
}

function formatTime(t) {
  if (!t) return '';
  const cleaned = t.replace(/-/g, (m, i) => i > 10 ? ':' : '-').replace(/-(\d{3})Z?$/, '.$1Z');
  const d = new Date(cleaned);
  if (isNaN(d.getTime())) return t;
  return d.toLocaleString();
}

function showModal(url) {
  document.getElementById("modalImg").src = url;
  document.getElementById("imageModal").classList.add("active");
}

function closeModal() {
  document.getElementById("imageModal").classList.remove("active");
}
</script>
</body>
</html>
