<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Image Editor</title>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0a0a0a; color: #eee; min-height: 100vh; }
  .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
  h1 { text-align: center; margin-bottom: 20px; background: linear-gradient(90deg, #06f, #f0f); -webkit-background-clip: text; background-clip: text; color: transparent; font-size: 1.8rem; }
  h2 { font-size: 1.3rem; margin-bottom: 12px; }
  h3 { font-size: 1.05rem; margin-bottom: 10px; color: #ccc; }

  .view { display: none; }
  .view.active { display: block; }

  .card { background: #1a1a1a; border-radius: 12px; padding: 20px; margin-bottom: 15px; border: 1px solid #2a2a2a; }
  .card-title { font-weight: 600; margin-bottom: 12px; color: #ddd; font-size: 0.95rem; }

  input, textarea, select { width: 100%; padding: 12px; background: #0f0f0f; border: 1px solid #333; color: #fff; border-radius: 8px; font-size: 1rem; font-family: inherit; }
  textarea { resize: vertical; min-height: 60px; }

  .btn { padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 1rem; }
  .btn-primary { background: linear-gradient(90deg, #06f, #a0f); color: white; }
  .btn-secondary { background: #333; color: white; }
  .btn-danger { background: #a03; color: white; }
  .btn-success { background: #0a5; color: white; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-small { padding: 6px 12px; font-size: 0.85rem; }
  .btn-full { width: 100%; }

  .auth-container { max-width: 380px; margin: 50px auto; }
  .auth-container input { margin-bottom: 12px; }
  .auth-tabs { display: flex; margin-bottom: 20px; }
  .auth-tabs button { flex: 1; padding: 10px; background: #222; border: 1px solid #333; color: #888; cursor: pointer; }
  .auth-tabs button.active { background: #06f; color: white; }
  .auth-tabs button:first-child { border-radius: 8px 0 0 8px; }
  .auth-tabs button:last-child { border-radius: 0 8px 8px 0; }

  .topbar { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; margin-bottom: 15px; border-bottom: 1px solid #2a2a2a; flex-wrap: wrap; gap: 10px; }
  .topbar .user-info { display: flex; align-items: center; gap: 12px; }
  .balance-badge { background: linear-gradient(90deg, #f80, #fa0); color: black; padding: 6px 14px; border-radius: 20px; font-weight: 700; font-size: 0.95rem; }

  .notes-banner { background: linear-gradient(90deg, #1a3a1a, #143314); border: 1px solid #2a5a2a; padding: 12px 16px; border-radius: 10px; margin-bottom: 15px; color: #cfc; font-size: 0.9rem; white-space: pre-wrap; line-height: 1.4; }

  .upload-area { border: 2px dashed #444; border-radius: 10px; padding: 30px 20px; text-align: center; cursor: pointer; }
  .upload-area:hover { border-color: #06f; }
  .upload-area input { display: none; }
  .preview { max-width: 100%; max-height: 300px; border-radius: 8px; margin: 12px auto; display: block; }
  .compressing { text-align: center; color: #888; font-size: 0.85rem; margin-top: 8px; }

  .preset-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px; }
  .preset-btn { padding: 12px; background: #222; border: 1px solid #333; color: #fff; border-radius: 8px; cursor: pointer; font-size: 0.85rem; }
  .preset-btn:hover { background: #06f; border-color: #06f; }
  .preset-btn.selected { background: linear-gradient(90deg, #06f, #a0f); border-color: #f0f; }
  .preset-cost { display: block; font-size: 0.7rem; color: #fa0; margin-top: 4px; font-weight: 700; }
  .preset-btn.selected .preset-cost { color: #ffd; }
  .preset-btn.custom-btn { background: #2a1a3a; border-color: #a0f; }
  .preset-btn.custom-btn:hover { background: #3a2a4a; }
  .preset-btn.custom-btn.selected { background: linear-gradient(90deg, #a0f, #f0f); }

  .custom-prompt-box { margin-top: 12px; padding: 12px; background: #0f0f0f; border-radius: 8px; border: 1px solid #a0f; }

  .status { text-align: center; padding: 15px; margin: 15px 0; background: #1a1a1a; border-radius: 8px; color: #06f; }
  .error { background: #2a1010; color: #f66; padding: 12px; border-radius: 8px; margin: 12px 0; font-size: 0.9rem; }
  .success { background: #103010; color: #6f6; padding: 12px; border-radius: 8px; margin: 12px 0; font-size: 0.9rem; }
  .spinner { display: inline-block; width: 18px; height: 18px; border: 3px solid #333; border-top-color: #06f; border-radius: 50%; animation: spin 1s linear infinite; vertical-align: middle; margin-right: 10px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .packs-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
  .pack-btn { background: #222; border: 2px solid #333; padding: 15px; border-radius: 10px; cursor: pointer; text-align: center; }
  .pack-btn:hover { border-color: #06f; }
  .pack-price { font-size: 1.4rem; font-weight: 800; color: #fa0; }
  .pack-coins { font-size: 0.9rem; color: #aaa; margin-top: 4px; }

  .pricing-chart { background: #0f0f0f; border-radius: 8px; padding: 12px; margin-bottom: 15px; }
  .pricing-chart-title { font-size: 0.85rem; color: #888; margin-bottom: 8px; }
  .pricing-chart table { width: 100%; font-size: 0.85rem; }
  .pricing-chart td { padding: 4px 0; }
  .pricing-chart td:last-child { text-align: right; color: #fa0; font-weight: 600; }

  .tabs { display: flex; gap: 4px; margin-bottom: 15px; overflow-x: auto; }
  .tabs button { background: #222; border: 1px solid #333; color: #aaa; padding: 8px 16px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
  .tabs button.active { background: #06f; color: white; border-color: #06f; }

  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { text-align: left; padding: 10px; border-bottom: 1px solid #2a2a2a; }
  th { color: #888; font-weight: 600; }

  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; justify-content: center; align-items: center; padding: 20px; }
  .modal.active { display: flex; }
  .modal-content { background: #1a1a1a; padding: 24px; border-radius: 12px; max-width: 500px; width: 100%; max-height: 90vh; overflow-y: auto; }
  .modal-content h3 { margin-bottom: 15px; }

  .result-img { max-width: 100%; max-height: 500px; border-radius: 8px; margin: 12px auto; display: block; }
  .logout-btn { background: #333; color: white; padding: 6px 14px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }

  .session-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .session-card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 10px; padding: 10px; cursor: pointer; position: relative; }
  .session-card:hover { border-color: #06f; }
  .session-card .del-btn { position: absolute; top: 6px; right: 6px; background: rgba(160,0,0,0.9); color: white; border: none; padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 0.7rem; z-index: 2; }
  .session-images { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
  .session-images img { width: 100%; height: 130px; object-fit: cover; border-radius: 6px; }
  .session-label { font-size: 0.7rem; color: #888; }
  .session-prompt { font-size: 0.8rem; color: #ddd; background: #0f0f0f; padding: 6px; border-radius: 6px; margin: 4px 0; max-height: 60px; overflow-y: auto; }
  .session-meta { font-size: 0.7rem; color: #888; }

  /* Full-screen image viewer */
  .viewer-overlay { position: fixed; inset: 0; background: #000; z-index: 200; display: none; flex-direction: column; }
  .viewer-overlay.active { display: flex; }
  .viewer-header { padding: 12px; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.8); border-bottom: 1px solid #222; color: #fff; }
  .viewer-header .info { font-size: 0.85rem; color: #aaa; }
  .viewer-header button { background: #333; color: white; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; }
  .viewer-body { flex: 1; position: relative; overflow: hidden; touch-action: none; }
  .viewer-image { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .viewer-image img { max-width: 100%; max-height: 100%; user-select: none; -webkit-user-drag: none; }
  .viewer-arrow { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.2); color: white; border: none; width: 50px; height: 80px; font-size: 2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 8px; }
  .viewer-arrow:hover { background: rgba(255,255,255,0.35); }
  .viewer-arrow.left { left: 10px; }
  .viewer-arrow.right { right: 10px; }
  .viewer-arrow:disabled { opacity: 0.2; cursor: not-allowed; }
  .viewer-footer { padding: 12px; background: rgba(0,0,0,0.85); border-top: 1px solid #222; color: #ddd; max-height: 30vh; overflow-y: auto; }
  .viewer-footer .prompt-line { font-size: 0.9rem; color: #ddd; background: #1a1a1a; padding: 8px; border-radius: 6px; margin: 6px 0; }
  .viewer-footer .meta-line { font-size: 0.75rem; color: #888; }
  .viewer-toggle { display: flex; gap: 4px; margin-top: 8px; }
  .viewer-toggle button { flex: 1; background: #222; border: 1px solid #333; color: #aaa; padding: 6px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
  .viewer-toggle button.active { background: #06f; color: white; border-color: #06f; }

  label { display: block; margin-bottom: 4px; font-size: 0.85rem; color: #aaa; }
  .form-row { margin-bottom: 10px; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .checkbox-row input[type="checkbox"] { width: auto; }
</style>
</head>
<body>

<div class="container">
  <h1>🎨 AI Image Editor</h1>

  <!-- LOGIN / SIGNUP -->
  <div id="authView" class="view active auth-container">
    <div class="auth-tabs">
      <button id="tabLogin" class="active" onclick="switchAuthTab('login')">Login</button>
      <button id="tabSignup" onclick="switchAuthTab('signup')">Sign Up</button>
    </div>
    <div class="card">
      <input type="email" id="authEmail" placeholder="Email" autocomplete="username">
      <input type="password" id="authPassword" placeholder="Password" autocomplete="current-password">
      <button class="btn btn-primary btn-full" id="authBtn" onclick="doAuth()">Login</button>
      <div id="authError" class="error" style="display:none;"></div>
    </div>
  </div>

  <!-- USER DASHBOARD -->
  <div id="userView" class="view">
    <div class="topbar">
      <div class="user-info"><span id="userEmail" style="font-size: 0.9rem; color: #aaa;"></span></div>
      <div style="display: flex; align-items: center; gap: 10px;">
        <span class="balance-badge">🪙 <span id="userBalance">0</span></span>
        <button class="btn btn-small btn-secondary" onclick="showBuyCoins()">+ Add Coins</button>
        <button class="logout-btn" onclick="logout()">Logout</button>
      </div>
    </div>

    <div id="notesBanner" class="notes-banner" style="display: none;"></div>

    <div class="card">
      <div class="card-title">1. Upload Image</div>
      <div class="upload-area" onclick="document.getElementById('fileInput').click()">
        <input type="file" id="fileInput" accept="image/*" onchange="handleFileSelect(event)">
        <p>📤 Click to select image</p>
      </div>
      <img id="preview" class="preview" style="display:none">
      <div id="compressInfo" class="compressing" style="display:none;"></div>
    </div>

    <div class="card">
      <div class="card-title">2. Choose Edit</div>
      <div id="presetGrid" class="preset-grid"></div>
      <div id="customPromptBox" class="custom-prompt-box" style="display: none;">
        <label>✍️ Write your custom prompt (<span id="customCostShow">120</span> coins)</label>
        <textarea id="customPrompt" placeholder="e.g., Make it look like a sunset landscape..."></textarea>
      </div>
    </div>

    <div class="card">
      <div class="card-title">3. LoRA Style (optional)</div>
      <select id="loraSelect">
        <option value="Photo-to-Anime">Photo-to-Anime</option>
        <option value="Anime-V2">Anime-V2</option>
        <option value="Multiple-Angles">Multiple-Angles</option>
        <option value="Light-Migration">Light-Migration</option>
        <option value="Upscaler">Upscaler</option>
        <option value="Style-Transfer">Style-Transfer</option>
        <option value="Manga-Tone">Manga-Tone</option>
        <option value="Anything2Real">Anything2Real</option>
        <option value="Polaroid-Photo">Polaroid-Photo</option>
        <option value="Unblur-Anything">Unblur-Anything</option>
        <option value="Hyper-Realistic-Portrait">Hyper-Realistic-Portrait</option>
        <option value="Ultra-Realistic-Portrait">Ultra-Realistic-Portrait</option>
        <option value="Pixar-Inspired-3D">Pixar-Inspired-3D</option>
        <option value="Noir-Comic-Book">Noir-Comic-Book</option>
        <option value="Any-light">Any-light</option>
        <option value="Studio-DeLight">Studio-DeLight</option>
        <option value="Cinematic-FlatLog">Cinematic-FlatLog</option>
        <option value="Midnight-Noir-Eyes-Spotlight">Midnight-Noir-Eyes-Spotlight</option>
        <option value="Fal-Multiple-Angles">Fal-Multiple-Angles</option>
      </select>
    </div>

    <div class="card">
      <button class="btn btn-primary btn-full" id="editBtn" onclick="submitEdit()">✨ Generate</button>
    </div>

    <div class="status" id="editStatus" style="display:none;">
      <span class="spinner"></span>
      <span>Processing... 20-90 seconds</span>
    </div>

    <div class="error" id="editError" style="display:none;"></div>
    <div class="success" id="editSuccess" style="display:none;"></div>

    <div class="card" id="resultCard" style="display:none;">
      <div class="card-title">Result</div>
      <img id="resultImg" class="result-img">
      <button class="btn btn-success btn-full" onclick="downloadResult()">⬇️ Download</button>
    </div>
  </div>

  <!-- ADMIN DASHBOARD -->
  <div id="adminView" class="view">
    <div class="topbar">
      <div><strong>👨‍💼 Admin Panel</strong> — <span id="adminEmail" style="color: #888;"></span></div>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
    <div class="tabs">
      <button class="active" data-tab="users" onclick="switchAdminTab('users')">Users</button>
      <button data-tab="presets" onclick="switchAdminTab('presets')">Presets</button>
      <button data-tab="packs" onclick="switchAdminTab('packs')">Coin Packs</button>
      <button data-tab="edits" onclick="switchAdminTab('edits')">Edits</button>
      <button data-tab="transactions" onclick="switchAdminTab('transactions')">Transactions</button>
      <button data-tab="settings" onclick="switchAdminTab('settings')">Settings</button>
    </div>
    <div id="adminContent" class="card">Loading...</div>
  </div>

  <!-- BUY COINS MODAL -->
  <div class="modal" id="buyModal" onclick="if(event.target===this) closeModal('buyModal')">
    <div class="modal-content">
      <h3>Buy Coins</h3>
      <div id="pricingChart" class="pricing-chart"></div>
      <div class="packs-grid" id="packsGrid"></div>
      <button class="btn btn-secondary btn-full" style="margin-top: 15px;" onclick="closeModal('buyModal')">Cancel</button>
    </div>
  </div>

  <!-- GENERIC MODAL -->
  <div class="modal" id="genericModal" onclick="if(event.target===this) closeModal('genericModal')">
    <div class="modal-content" id="genericModalContent"></div>
  </div>

  <!-- FULL-SCREEN IMAGE VIEWER -->
  <div class="viewer-overlay" id="viewer">
    <div class="viewer-header">
      <div class="info" id="viewerInfo"></div>
      <button onclick="closeViewer()">✕ Close</button>
    </div>
    <div class="viewer-body" id="viewerBody">
      <button class="viewer-arrow left" id="viewerPrev" onclick="viewerNav(-1)">‹</button>
      <div class="viewer-image">
        <img id="viewerImg" alt="">
      </div>
      <button class="viewer-arrow right" id="viewerNext" onclick="viewerNav(1)">›</button>
    </div>
    <div class="viewer-footer">
      <div class="viewer-toggle">
        <button id="viewerBtnInput" class="active" onclick="viewerSetImage('input')">Input</button>
        <button id="viewerBtnOutput" onclick="viewerSetImage('output')">Output</button>
      </div>
      <div class="prompt-line" id="viewerPrompt"></div>
      <div class="meta-line" id="viewerMeta"></div>
    </div>
  </div>
</div>

<script>
let currentUser = null;
let currentToken = null;
let config = { presets: [], coin_packs: [], custom_prompt_cost: 120, custom_prompt_enabled: true, default_lora: 'Photo-to-Anime', user_notes: '', razorpay_key_id: '' };
let selectedPresetId = null;
let selectedIsCustom = false;
let selectedImageBase64 = null;
let resultImageData = null;
let authMode = 'login';
let editsList = [];
let currentEditIndex = 0;
let viewerImageMode = 'input';

// Zoom & pan state for viewer
let viewerZoom = 1;
let viewerPanX = 0, viewerPanY = 0;
let viewerLastTouches = null;
let viewerLastMousePos = null;
let viewerIsDragging = false;

window.addEventListener('DOMContentLoaded', () => {
  currentToken = localStorage.getItem('token');
  loadConfig().then(() => {
    if (currentToken) fetchMe();
  });
  setupViewerGestures();
});

async function loadConfig() {
  try {
    const res = await fetch('/api/main?action=config');
    config = await res.json();
    renderPresets();
    renderPacks();
    renderNotes();
    const loraSelect = document.getElementById('loraSelect');
    if (loraSelect && config.default_lora) loraSelect.value = config.default_lora;
  } catch (e) { console.error('Config load failed', e); }
}

function renderNotes() {
  const banner = document.getElementById('notesBanner');
  if (!banner) return;
  const notes = (config.user_notes || '').trim();
  if (notes) {
    banner.innerHTML = '📢 ' + escapeHtml(notes);
    banner.style.display = 'block';
  } else {
    banner.style.display = 'none';
  }
}

function switchAuthTab(mode) {
  authMode = mode;
  document.getElementById('tabLogin').classList.toggle('active', mode === 'login');
  document.getElementById('tabSignup').classList.toggle('active', mode === 'signup');
  document.getElementById('authBtn').textContent = mode === 'login' ? 'Login' : 'Sign Up';
  document.getElementById('authError').style.display = 'none';
}

async function doAuth() {
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  const errBox = document.getElementById('authError');
  errBox.style.display = 'none';
  if (!email || !password) return showErr(errBox, 'Enter email and password');
  try {
    const res = await fetch(`/api/main?action=${authMode}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await parseJsonSafe(res);
    if (!res.ok || data.error) throw new Error(data.error || 'Failed');
    currentToken = data.token;
    currentUser = data.user;
    localStorage.setItem('token', currentToken);
    resetUIState();
    showDashboard();
  } catch (err) {
    showErr(errBox, err.message);
  }
}

async function fetchMe() {
  try {
    const res = await fetch('/api/main?action=me', { headers: { Authorization: `Bearer ${currentToken}` } });
    if (!res.ok) throw new Error('Session expired');
    const data = await parseJsonSafe(res);
    currentUser = data.user;
    resetUIState();
    showDashboard();
  } catch {
    logout();
  }
}

function logout() {
  localStorage.removeItem('token');
  currentToken = null;
  currentUser = null;
  resetUIState();
  hideAll();
  document.getElementById('authView').classList.add('active');
  document.getElementById('authEmail').value = '';
  document.getElementById('authPassword').value = '';
}

function resetUIState() {
  selectedImageBase64 = null;
  resultImageData = null;
  selectedPresetId = null;
  selectedIsCustom = false;
  const preview = document.getElementById('preview');
  if (preview) { preview.src = ''; preview.style.display = 'none'; }
  const fileInput = document.getElementById('fileInput');
  if (fileInput) fileInput.value = '';
  const resultCard = document.getElementById('resultCard');
  if (resultCard) resultCard.style.display = 'none';
  const resultImg = document.getElementById('resultImg');
  if (resultImg) resultImg.src = '';
  const customPrompt = document.getElementById('customPrompt');
  if (customPrompt) customPrompt.value = '';
  ['editError', 'editSuccess', 'editStatus', 'customPromptBox', 'compressInfo'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.style.display = 'none';
  });
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('selected'));
}

function showDashboard() {
  hideAll();
  if (currentUser.is_admin) {
    document.getElementById('adminView').classList.add('active');
    document.getElementById('adminEmail').textContent = currentUser.email;
    switchAdminTab('users');
  } else {
    document.getElementById('userView').classList.add('active');
    document.getElementById('userEmail').textContent = currentUser.email;
    document.getElementById('userBalance').textContent = currentUser.balance;
    renderNotes();
  }
}

function hideAll() {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
}

// =========================================================
// IMAGE COMPRESSION (crucial fix for payload size)
// =========================================================
async function compressImage(file, maxDim = 1600, quality = 0.85) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        // Resize if larger than maxDim
        if (width > maxDim || height > maxDim) {
          if (width > height) {
            height = Math.round(height * (maxDim / width));
            width = maxDim;
          } else {
            width = Math.round(width * (maxDim / height));
            height = maxDim;
          }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        // Output JPEG for max compression
        canvas.toBlob((blob) => {
          const r2 = new FileReader();
          r2.onload = (ev) => resolve({ dataUrl: ev.target.result, sizeKB: Math.round(blob.size / 1024), width, height });
          r2.onerror = reject;
          r2.readAsDataURL(blob);
        }, 'image/jpeg', quality);
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function handleFileSelect(event) {

async function submitEdit() {
  const errBox = document.getElementById('editError');
  const successBox = document.getElementById('editSuccess');
  const status = document.getElementById('editStatus');
  const resultCard = document.getElementById('resultCard');
  const btn = document.getElementById('editBtn');
  errBox.style.display = 'none';
  successBox.style.display = 'none';
  resultCard.style.display = 'none';

  if (!selectedImageBase64) return showErr(errBox, 'Select an image first');
  let prompt, is_custom = false, preset_id = null;
  if (selectedIsCustom) {
    prompt = document.getElementById('customPrompt').value.trim();
    if (!prompt) return showErr(errBox, 'Type your custom prompt');
    is_custom = true;
  } else if (selectedPresetId) {
    const preset = config.presets.find(p => p.id === selectedPresetId);
    if (!preset) return showErr(errBox, 'Preset not found');
    prompt = preset.prompt;
    preset_id = preset.id;
  } else {
    return showErr(errBox, 'Choose an edit');
  }
  const lora = document.getElementById('loraSelect').value;

  btn.disabled = true;
  status.style.display = 'block';
  try {
    const res = await fetch('/api/main?action=edit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${currentToken}` },
      body: JSON.stringify({ image: selectedImageBase64, prompt, lora, preset_id, is_custom })
    });
    const data = await parseJsonSafe(res);
    if (!res.ok || data.error) {
      if (data.refunded) {
        showErr(errBox, `${data.message || data.error}. Refunded ${data.refunded} coins.`);
        currentUser.balance = data.new_balance;
        document.getElementById('userBalance').textContent = currentUser.balance;
      } else {
        showErr(errBox, data.message || data.error || 'Failed');
      }
      return;
    }
    resultImageData = data.image;
    document.getElementById('resultImg').src = data.image;
    resultCard.style.display = 'block';
    currentUser.balance = data.new_balance;
    document.getElementById('userBalance').textContent = currentUser.balance;
    successBox.textContent = `✅ Edit complete! -${data.coins_spent} coins`;
    successBox.style.display = 'block';
  } catch (err) {
    showErr(errBox, err.message);
  } finally {
    btn.disabled = false;
    status.style.display = 'none';
  }
}

async function parseJsonSafe(res) {
  const text = await res.text();
  try { return JSON.parse(text); }
  catch { return { error: 'Server error', message: text.slice(0, 200) }; }
}

async function buyPack(packId) {
  try {
    const res = await fetch('/api/main?action=create_order', {

    closeModal('buyModal');

      method: 'POST',

      body: JSON.stringify(response)
    });

    currentUser.balance = data.new_balance;
    document.getElementById('userBalance').textContent = currentUser.balance;
    alert(`✅ Success! Added ${data.coins_added} coins. Balance: ${data.new_balance}`);
  } catch (err) { alert('Payment verification error: ' + err.message); }

// =========================================================
// FULL-SCREEN IMAGE VIEWER
// =========================================================
function openViewer(index) {
  currentEditIndex = index;
  viewerImageMode = 'input';
  document.getElementById('viewer').classList.add('active');
  renderViewer();
}

function closeViewer() {
  document.getElementById('viewer').classList.remove('active');
}

function viewerSetImage(mode) {
  viewerImageMode = mode;
  document.getElementById('viewerBtnInput').classList.toggle('active', mode === 'input');
  document.getElementById('viewerBtnOutput').classList.toggle('active', mode === 'output');
  renderViewer();
}

function renderViewer() {
  const e = editsList[currentEditIndex];
  if (!e) return;
  const imgUrl = viewerImageMode === 'input' ? e.input_url : e.output_url;
  document.getElementById('viewerImg').src = imgUrl || '';
  document.getElementById('viewerInfo').textContent = `${currentEditIndex + 1} / ${editsList.length}  ·  ${e.email || ''}  ·  ${viewerImageMode.toUpperCase()}`;
  document.getElementById('viewerPrompt').textContent = e.prompt || '';
  document.getElementById('viewerMeta').textContent = `${e.coins_spent} 🪙 · ${e.status} · ${e.lora || ''} · ${new Date(e.created_at).toLocaleString()}`;
  document.getElementById('viewerPrev').disabled = currentEditIndex === 0;
  document.getElementById('viewerNext').disabled = currentEditIndex === editsList.length - 1;
  resetViewerTransform();
}

function viewerNav(delta) {
  const newIdx = currentEditIndex + delta;
  if (newIdx < 0 || newIdx >= editsList.length) return;
  currentEditIndex = newIdx;
  renderViewer();
}

function resetViewerTransform() {
  viewerZoom = 1;
  viewerPanX = 0;
  viewerPanY = 0;
  applyViewerTransform();
}

function applyViewerTransform() {
  const img = document.getElementById('viewerImg');
  if (!img) return;
  img.style.transform = `translate(${viewerPanX}px, ${viewerPanY}px) scale(${viewerZoom})`;
  img.style.transformOrigin = 'center center';
  img.style.transition = viewerIsDragging ? 'none' : 'transform 0.2s';
}

function setupViewerGestures() {
  const body = document.getElementById('viewerBody');
  const img = document.getElementById('viewerImg');
  if (!body || !img) return;

  // Wheel zoom (desktop)
  body.addEventListener('wheel', (e) => {
    e.preventDefault();
    const delta = e.deltaY < 0 ? 1.15 : 0.87;
    viewerZoom = Math.max(0.5, Math.min(8, viewerZoom * delta));
    applyViewerTransform();
  }, { passive: false });

  // Double click reset
  img.addEventListener('dblclick', () => {
    if (viewerZoom > 1) resetViewerTransform();
    else { viewerZoom = 2.5; applyViewerTransform(); }
  });

  // Mouse drag pan
  body.addEventListener('mousedown', (e) => {
    if (viewerZoom <= 1) return;
    viewerIsDragging = true;
    viewerLastMousePos = { x: e.clientX, y: e.clientY };
  });
  window.addEventListener('mousemove', (e) => {
    if (!viewerIsDragging || !viewerLastMousePos) return;
    viewerPanX += e.clientX - viewerLastMousePos.x;
    viewerPanY += e.clientY - viewerLastMousePos.y;
    viewerLastMousePos = { x: e.clientX, y: e.clientY };
    applyViewerTransform();
  });
  window.addEventListener('mouseup', () => {
    viewerIsDragging = false;
    viewerLastMousePos = null;
  });

  // Touch gestures (pinch zoom, pan, swipe)
  let touchStartX = null;
  body.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1 && viewerZoom <= 1) {
      touchStartX = e.touches[0].clientX;
    } else if (e.touches.length === 2) {
      viewerLastTouches = getTouchInfo(e.touches);
    } else if (e.touches.length === 1 && viewerZoom > 1) {
      viewerIsDragging = true;
      viewerLastMousePos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }
  }, { passive: true });

  body.addEventListener('touchmove', (e) => {
    if (e.touches.length === 2 && viewerLastTouches) {
      e.preventDefault();
      const cur = getTouchInfo(e.touches);
      const scale = cur.dist / viewerLastTouches.dist;
      viewerZoom = Math.max(0.5, Math.min(8, viewerZoom * scale));
      viewerLastTouches = cur;
      applyViewerTransform();
    } else if (e.touches.length === 1 && viewerIsDragging && viewerLastMousePos) {
      e.preventDefault();
      viewerPanX += e.touches[0].clientX - viewerLastMousePos.x;
      viewerPanY += e.touches[0].clientY - viewerLastMousePos.y;
      viewerLastMousePos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      applyViewerTransform();
    }
  }, { passive: false });

  body.addEventListener('touchend', (e) => {
    if (touchStartX !== null && e.changedTouches.length === 1 && viewerZoom <= 1) {
      const dx = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(dx) > 60) {
        viewerNav(dx > 0 ? -1 : 1);
      }
    }
    touchStartX = null;
    viewerLastTouches = null;
    viewerIsDragging = false;
    viewerLastMousePos = null;
  });
}

function getTouchInfo(touches) {
  const dx = touches[0].clientX - touches[1].clientX;
  const dy = touches[0].clientY - touches[1].clientY;
  return { dist: Math.hypot(dx, dy) };
}

document.addEventListener('keydown', (e) => {
  const active = document.getElementById('viewer').classList.contains('active');
  if (!active) return;
  if (e.key === 'ArrowLeft') viewerNav(-1);
  else if (e.key === 'ArrowRight') viewerNav(1);
  else if (e.key === 'Escape') closeViewer();
  else if (e.key === 'i' || e.key === 'I') viewerSetImage('input');
  else if (e.key === 'o' || e.key === 'O') viewerSetImage('output');
});

    <div class="checkbox-row">
      <input type="checkbox" id="customEnabled" ${config.custom_prompt_enabled ? 'checked' : ''}>
      <label for="customEnabled" style="margin: 0;">Enable Custom Prompt Button</label>
    </div>
    <div class="form-row">
      <label>Custom Prompt Cost (coins)</label>
      <input type="number" id="customCostInput" value="${config.custom_prompt_cost}">
    </div>
    <button class="btn btn-success" onclick="saveAllSettings()">💾 Save Settings</button>`;
}

async function saveAllSettings() {
  const payload = {
    user_notes: document.getElementById('userNotesInput').value,
    default_lora: document.getElementById('defaultLoraInput').value,
    custom_prompt_enabled: document.getElementById('customEnabled').checked,
    custom_prompt_cost: parseInt(document.getElementById('customCostInput').value) || 120
  };
  const res = await apiAdmin('admin_save_settings', payload);
  if (res.error) return alert('Error: ' + res.error);
  alert('✅ Settings saved');
  await loadConfig();
}

async function apiAdmin(action, body) {
  const res = await fetch(`/api/main?action=${action}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${currentToken}` },
    body: body ? JSON.stringify(body) : null
  });
  return await parseJsonSafe(res);
}

function closeModal(id) { document.getElementById(id).classList.remove('active'); }

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = String(s ?? '');
  return div.innerHTML;
}
</script>
</body>
</html>
